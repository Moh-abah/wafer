<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005B82"/>
      <stop offset="60%" stop-color="#003B55"/>
      <stop offset="100%" stop-color="#002A3F"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB833"/>
      <stop offset="50%" stop-color="#FFA800"/>
      <stop offset="100%" stop-color="#E69600"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A4A63"/>
      <stop offset="100%" stop-color="#003B55"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB833" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFB833" stop-opacity="0"/>
    </radialGradient>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bgGrad)"/>

  <!-- Decorative diagonal stripes (right side) -->
  <g opacity="0.08" fill="#FFB833">
    <polygon points="1024,0 1024,500 824,500 624,0"/>
    <polygon points="1024,0 1024,500 924,500 724,0"/>
  </g>

  <!-- Soft glow behind the phone -->
  <circle cx="760" cy="250" r="280" fill="url(#glow)"/>

  <!-- Decorative dots pattern (top-left) -->
  <g fill="#FFFFFF" opacity="0.12">
    <circle cx="50" cy="50" r="3"/>
    <circle cx="90" cy="50" r="3"/>
    <circle cx="130" cy="50" r="3"/>
    <circle cx="50" cy="90" r="3"/>
    <circle cx="90" cy="90" r="3"/>
    <circle cx="50" cy="130" r="3"/>
  </g>

  <!-- Logo mark -->
  <g transform="translate(80, 80)">
    <rect width="96" height="96" rx="24" fill="#002A3F" stroke="#FFB833" stroke-width="2"/>
    <g transform="translate(40, 14) scale(1.4)">
      <path d="M-1,-8 L8,-8 L12,-4 L12,6 L4,14 L-5,5 Z" fill="#FFA800" stroke="#E69600" stroke-width="0.6"/>
      <circle cx="5" cy="-3" r="1.8" fill="white" opacity="0.9"/>
      <path d="M3.5,6 Q7,9.5 10.5,6" stroke="white" stroke-width="1" fill="none" stroke-linecap="round"/>
    </g>
    <text x="68" y="70" font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-size="48" font-weight="900" fill="url(#goldGrad)" text-anchor="middle">و</text>
  </g>

  <!-- App name (Arabic) -->
  <text x="200" y="140" font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF">وفر</text>
  <text x="200" y="175" font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="500" fill="#FFB833" opacity="0.95">بوابة المنشآت</text>

  <!-- Main headline -->
  <text x="80" y="260" font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">أدر منشأتك وخصوماتك بنقرة واحدة</text>
  <text x="80" y="312" font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF" opacity="0.92">من مطعمك أو مقهاك — في أي وقت</text>

  <!-- Subheadline / value prop -->
  <text x="80" y="360" font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="500" fill="#FFFFFF" opacity="0.78">سجّل منشأتك • أضف منتجاتك • استقبل عملاء وفر</text>

  <!-- Phone mockup (right side) with owner portal UI preview -->
  <g transform="translate(640, 100)" filter="url(#phoneShadow)">
    <!-- Phone frame -->
    <rect width="280" height="500" rx="36" fill="#002A3F" stroke="#FFB833" stroke-width="2"/>
    <rect x="10" y="10" width="260" height="480" rx="28" fill="url(#phoneGrad)"/>
    <!-- Notch -->
    <rect x="110" y="20" width="60" height="8" rx="4" fill="#001A28"/>

    <!-- App header inside phone -->
    <text x="140" y="70" font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">وفر — بوابة المنشآت</text>
    <line x1="20" y1="84" x2="260" y2="84" stroke="#FFB833" stroke-width="0.5" opacity="0.5"/>

    <!-- Stat cards row -->
    <g transform="translate(20, 100)">
      <rect width="115" height="60" rx="8" fill="#FFB833" opacity="0.15"/>
      <text x="10" y="22" font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#FFB833">المنتجات</text>
      <text x="10" y="46" font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">٤٨</text>

      <g transform="translate(125, 0)">
        <rect width="115" height="60" rx="8" fill="#FFB833" opacity="0.15"/>
        <text x="10" y="22" font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#FFB833">المتاح منها</text>
        <text x="10" y="46" font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">٤٢</text>
      </g>
    </g>

    <!-- Products list -->
    <text x="20" y="195" font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" opacity="0.7">المنتجات</text>
    <g transform="translate(20, 205)">
      <!-- Row 1 -->
      <rect width="240" height="44" rx="6" fill="#FFFFFF" opacity="0.06"/>
      <circle cx="22" cy="22" r="14" fill="#FFB833" opacity="0.3"/>
      <text x="48" y="20" font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">كابتشينو</text>
      <text x="48" y="35" font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#FFB833">١٤ ر.س</text>
      <circle cx="220" cy="22" r="4" fill="#3FB984"/>

      <!-- Row 2 -->
      <g transform="translate(0, 50)">
        <rect width="240" height="44" rx="6" fill="#FFFFFF" opacity="0.06"/>
        <circle cx="22" cy="22" r="14" fill="#FFB833" opacity="0.3"/>
        <text x="48" y="20" font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">لاتيه</text>
        <text x="48" y="35" font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#FFB833">١٦ ر.س</text>
        <circle cx="220" cy="22" r="4" fill="#3FB984"/>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 100)">
        <rect width="240" height="44" rx="6" fill="#FFFFFF" opacity="0.06"/>
        <circle cx="22" cy="22" r="14" fill="#FFB833" opacity="0.3"/>
        <text x="48" y="20" font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">شاي كرك</text>
        <text x="48" y="35" font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#FFB833">٨ ر.س</text>
        <circle cx="220" cy="22" r="4" fill="#3FB984"/>
      </g>
    </g>

    <!-- Bottom nav -->
    <line x1="20" y1="440" x2="260" y2="440" stroke="#FFB833" stroke-width="0.5" opacity="0.3"/>
    <g transform="translate(20, 455)" font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-size="9" font-weight="600" fill="#FFFFFF" opacity="0.6" text-anchor="middle">
      <text x="40" y="10">الرئيسية</text>
      <text x="120" y="10">المنتجات</text>
      <text x="200" y="10" fill="#FFB833" opacity="1">الإعدادات</text>
    </g>
  </g>

  <!-- Bottom strip: 3 mini value props -->
  <g font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-weight="700" fill="#FFFFFF">
    <g transform="translate(80, 410)">
      <circle cx="14" cy="14" r="14" fill="#FFB833"/>
      <text x="14" y="20" font-size="16" font-weight="900" fill="#003B55" text-anchor="middle">✓</text>
      <text x="38" y="20" font-size="18">إدارة المنتجات</text>
    </g>
    <g transform="translate(280, 410)">
      <circle cx="14" cy="14" r="14" fill="#FFB833"/>
      <text x="14" y="20" font-size="16" font-weight="900" fill="#003B55" text-anchor="middle">✓</text>
      <text x="38" y="20" font-size="18">استيراد Excel</text>
    </g>
    <g transform="translate(480, 410)">
      <circle cx="14" cy="14" r="14" fill="#FFB833"/>
      <text x="14" y="20" font-size="16" font-weight="900" fill="#003B55" text-anchor="middle">✓</text>
      <text x="38" y="20" font-size="18">يعمل أوفلاين</text>
    </g>
  </g>
</svg>
