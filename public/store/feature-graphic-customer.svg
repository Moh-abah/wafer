<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006B95"/>
      <stop offset="60%" stop-color="#005B82"/>
      <stop offset="100%" stop-color="#003B55"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB833"/>
      <stop offset="50%" stop-color="#FFA800"/>
      <stop offset="100%" stop-color="#E69600"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB833"/>
      <stop offset="100%" stop-color="#E69600"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB833" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFB833" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bgGrad)"/>

  <!-- Decorative diagonal stripes (right side) -->
  <g opacity="0.08" fill="#FFB833">
    <polygon points="1024,0 1024,500 824,500 624,0"/>
    <polygon points="1024,0 1024,500 924,500 724,0"/>
  </g>

  <!-- Soft glow behind the card -->
  <circle cx="760" cy="250" r="280" fill="url(#glow)"/>

  <!-- Decorative dots pattern (top-left) -->
  <g fill="#FFFFFF" opacity="0.12">
    <circle cx="50" cy="50" r="3"/>
    <circle cx="90" cy="50" r="3"/>
    <circle cx="130" cy="50" r="3"/>
    <circle cx="50" cy="90" r="3"/>
    <circle cx="90" cy="90" r="3"/>
    <circle cx="50" cy="130" r="3"/>
  </g>

  <!-- Logo mark: shopping tag + و -->
  <g transform="translate(80, 80)">
    <rect width="96" height="96" rx="24" fill="#003B55" stroke="#FFB833" stroke-width="2"/>
    <g transform="translate(40, 14) scale(1.4)">
      <path d="M-1,-8 L8,-8 L12,-4 L12,6 L4,14 L-5,5 Z" fill="#FFA800" stroke="#E69600" stroke-width="0.6"/>
      <circle cx="5" cy="-3" r="1.8" fill="white" opacity="0.9"/>
      <path d="M3.5,6 Q7,9.5 10.5,6" stroke="white" stroke-width="1" fill="none" stroke-linecap="round"/>
    </g>
    <text x="68" y="70" font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-size="48" font-weight="900" fill="url(#goldGrad)" text-anchor="middle">و</text>
  </g>

  <!-- App name (Arabic) -->
  <text x="200" y="140" font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF">وفر</text>
  <text x="200" y="175" font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="500" fill="#FFB833" opacity="0.95">بطاقة الخصم السعودية</text>

  <!-- Main headline -->
  <text x="80" y="260" font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">خصومات حصرية تصل إلى ٣٠٪</text>
  <text x="80" y="312" font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF" opacity="0.92">في آلاف المطاعم والمقاهي والمرافق</text>

  <!-- Subheadline / value prop -->
  <text x="80" y="360" font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="500" fill="#FFFFFF" opacity="0.78">سجّل مجاناً • احصل على بطاقتك • استمتع بالخصم فوراً</text>

  <!-- Membership card mockup (right side) -->
  <g transform="translate(620, 170)" filter="url(#cardShadow)">
    <rect width="340" height="210" rx="20" fill="url(#cardGrad)"/>
    <!-- Card top: logo + bank-style -->
    <text x="24" y="42" font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="900" fill="#003B55">وفر — بطاقة العضوية</text>
    <text x="24" y="64" font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#003B55" opacity="0.7">WA FIR · MEMBERSHIP CARD</text>
    <!-- Discount badge -->
    <g transform="translate(260, 24)">
      <rect width="64" height="36" rx="8" fill="#003B55"/>
      <text x="32" y="24" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#FFB833" text-anchor="middle">30%</text>
    </g>
    <!-- Membership number -->
    <text x="24" y="120" font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#003B55" opacity="0.7">رقم العضوية</text>
    <text x="24" y="148" font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#003B55" letter-spacing="2">7291 4853 9012 6658</text>
    <!-- Validity -->
    <text x="24" y="184" font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#003B55" opacity="0.7">صالحة حتى ٢٠٢٧/٠٩/٠٤ · سنوية</text>
    <!-- Decorative chip -->
    <g transform="translate(280, 160)">
      <rect width="40" height="30" rx="5" fill="#003B55" opacity="0.85"/>
      <line x1="0" y1="10" x2="40" y2="10" stroke="#FFB833" stroke-width="0.5" opacity="0.4"/>
      <line x1="0" y1="20" x2="40" y2="20" stroke="#FFB833" stroke-width="0.5" opacity="0.4"/>
      <line x1="13" y1="0" x2="13" y2="30" stroke="#FFB833" stroke-width="0.5" opacity="0.4"/>
      <line x1="27" y1="0" x2="27" y2="30" stroke="#FFB833" stroke-width="0.5" opacity="0.4"/>
    </g>
  </g>

  <!-- Bottom strip: 3 mini value props -->
  <g font-family="Cairo, 'Segoe UI', Arial, sans-serif" font-weight="700" fill="#FFFFFF">
    <g transform="translate(80, 410)">
      <circle cx="14" cy="14" r="14" fill="#FFB833"/>
      <text x="14" y="20" font-size="16" font-weight="900" fill="#003B55" text-anchor="middle">✓</text>
      <text x="38" y="20" font-size="18">آلاف المنشآت</text>
    </g>
    <g transform="translate(280, 410)">
      <circle cx="14" cy="14" r="14" fill="#FFB833"/>
      <text x="14" y="20" font-size="16" font-weight="900" fill="#003B55" text-anchor="middle">✓</text>
      <text x="38" y="20" font-size="18">خصم فوري ٣٠٪</text>
    </g>
    <g transform="translate(480, 410)">
      <circle cx="14" cy="14" r="14" fill="#FFB833"/>
      <text x="14" y="20" font-size="16" font-weight="900" fill="#003B55" text-anchor="middle">✓</text>
      <text x="38" y="20" font-size="18">١٣ منطقة سعودية</text>
    </g>
  </g>
</svg>
